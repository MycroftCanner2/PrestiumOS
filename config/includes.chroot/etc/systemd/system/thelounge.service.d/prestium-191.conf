# Prestium: The Lounge must not reach Tor (or its control filter) over unix sockets
# 2.1: nor anything of its Tor instance (thelounge-tor.service)
[Service]
InaccessiblePaths=-/run/tor -/run/onion-grater
InaccessiblePaths=-/var/lib/thelounge-tor -/run/prestium-thelounge-tor -/run/prestium-thelounge-tor-launch
