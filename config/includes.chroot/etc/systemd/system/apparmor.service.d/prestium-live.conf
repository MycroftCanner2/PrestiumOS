# Prestium: load AppArmor profiles on the live system too (Debian skips them on a live overlay)
# 2.1: Debian's unit has ConditionPathExists=!/run/live/overlay/work, and live-boot always makes that
# directory, so without this the service is skipped on every boot. The empty assignment resets every
# Condition* of the unit (ConditionSecurity=apparmor too): with AppArmor off in the kernel the service
# then fails, visibly, instead of being skipped (prestium-safety-notify alerts either way).
# tests/test_apparmor_boot_load.sh checks this.
[Unit]
ConditionPathExists=
