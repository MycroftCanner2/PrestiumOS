# Prestium 2.0 r6: sandbox i2pd like thelounge/onion-grater.
# ProtectHome=read-only (not tmpfs): Torrents under /home/user must remain visible via ReadWritePaths.
[Service]
NoNewPrivileges=yes
ProtectSystem=strict
ProtectHome=read-only
PrivateTmp=yes
PrivateDevices=yes
ProtectKernelTunables=yes
ProtectKernelModules=yes
ProtectControlGroups=yes
RestrictNamespaces=yes
LockPersonality=yes
RestrictRealtime=yes
RestrictSUIDSGID=yes
SystemCallArchitectures=native
# 2.1 (security audit): no view of other uids' processes (their command lines)
ProtectProc=invisible
CapabilityBoundingSet=
RestrictAddressFamilies=AF_INET AF_INET6 AF_UNIX AF_NETLINK
ReadWritePaths=/var/lib/i2pd /run/i2pd -/home/user/Torrents
