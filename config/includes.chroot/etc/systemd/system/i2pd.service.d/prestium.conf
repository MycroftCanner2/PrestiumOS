# Prestium: keep the router's config in /var/lib/i2pd, as the original Prestium unit did
# (package 3.0.0 ships /usr/bin/i2pd and /etc/i2pd).
# 2.1: logging is chosen by the boot entry (prestium-i2pd-start): the "Network Logs" entry logs to
# syslog at info, so the I2P tab in Network Logs (prestium-logs reads the journal) has something in
# it; the default boot logs nothing (--loglevel=none). At warn the tab stayed empty in normal
# operation (i2pd logs almost nothing at warn); info is the level Tor logs at, and lists
# router/tunnel state, not user traffic.
[Service]
ExecStart=
ExecStart=/usr/local/sbin/prestium-i2pd-start

# Prestium 1.7: random per-boot port, opened in the firewall after ferm loads.
[Unit]
After=ferm.service
[Service]
ExecStartPre=+/usr/local/sbin/prestium-i2pd-port

# 2.1 (review of 6bf1234): bounded start and stop. The port script may wait 10 s for the config lock and
# reload ferm twice (60 s each at most, the second time when it rolls back), so the default 90 s start
# timeout could kill it mid-rollback. i2pd stops at once on SIGTERM. prestium-i2p-mode apply's time
# budget relies on these two (220 s for a restart; see its header).
[Service]
TimeoutStartSec=180
TimeoutStopSec=30
