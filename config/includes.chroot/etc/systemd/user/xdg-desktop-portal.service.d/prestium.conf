# Prestium (security review F-01): xdg-desktop-portal's view of back ends and link handlers.
#  - back ends: only /usr/share/prestium/portal/portals (portals.conf there): not the user's
#    ~/.local/share/xdg-desktop-portal or ~/.config/xdg-desktop-portal.
#  - OpenURI: GIO looks handlers up in XDG_DATA_DIRS, XDG_DATA_HOME, XDG_CONFIG_HOME and
#    XDG_CONFIG_DIRS. All four point at /usr/share/prestium/portal/open (read-only), whose only
#    handler is Prestium's portal-open (http and https: Tor Browser; mailto: Claws Mail). A desktop
#    file or mimeapps.list in the user's home (which an application could write) is never used, and
#    there is no handler for files, so nothing a confined application sends through the portal runs
#    any other program.
#  - GSettings: the portal needs its schemas, which are no longer under XDG_DATA_DIRS.
[Service]
Environment=XDG_DESKTOP_PORTAL_DIR=/usr/share/prestium/portal/portals
Environment=XDG_DATA_DIRS=/usr/share/prestium/portal/open
Environment=XDG_DATA_HOME=/usr/share/prestium/portal/open/home
Environment=XDG_CONFIG_HOME=/usr/share/prestium/portal/open/config
Environment=XDG_CONFIG_DIRS=/usr/share/prestium/portal/open/config
Environment=GSETTINGS_SCHEMA_DIR=/usr/share/glib-2.0/schemas
