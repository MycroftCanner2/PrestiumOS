def $user_uid = 1000;
def $i2pd_uid = 2000;
def $tor_uid = debian-tor;
# Prestium 1.8: local-only Firefox (primary group) and The Lounge (user)
def $localweb_gid = prestium-localweb;
def $lounge_uid = thelounge;
# 2.1: The Lounge's second instance, IRC (Tor)
def $lounge_tor_uid = thelounge-tor;
# Prestium 2.0: DoH lookups for Tor's pluggable transports (through the I2P outproxy)
def $ptdns_uid = prestium-ptdns;
# Prestium: the only 127.0.0.1 TCP ports apps running as "user" may open.
#   4444 I2P HTTP proxy (LibreWolf)   4447 I2P SOCKS (Feather, other I2P apps)
#   4450 I2P "system" HTTP proxy (http_proxy in /etc/environment)
#   7659/7660 postman SMTP/POP3 tunnels (Claws Mail "Mail (I2P)")
#   9050 Tor SOCKS (Tor Browser, Gajim, torsocks). Feather uses I2P (4447, ~/.config/feather/settings.json);
#        it runs as "user" like these apps, so a port can't be closed for Feather alone.
#   17600:17650 OnionShare's own local web server (it talks to itself on stop)
# Not listed on purpose: 7070 i2pd console, 7685 I2P Torrents, 9000 The Lounge (I2P),
# 9010 The Lounge (Tor) (local-only Firefox gid only), 7656 SAM (off), 9051/control (onion-grater only).
# The Lounge (uid thelounge) has its own rule for its IRC tunnels 6665-6672, and its Tor
# instance (uid thelounge-tor) one for Tor's SOCKS port 9050.
def $user_ports = (4444 4447 4450 7659 7660 9050 17600:17650);

domain ip {
	table filter {
		chain INPUT {
			policy DROP;

			mod state state INVALID DROP;
			mod state state (ESTABLISHED) ACCEPT;

			interface lo ACCEPT;

			# Prestium 2.0 r5: i2pd's per-boot port (written by prestium-i2pd-port to
			# /run/prestium/i2pd.port), so peers can reach the router (not "firewalled").
			# IPv4 only: the ip6 domain below keeps every inbound IPv6 connection closed.
			@def $i2pd_port = `/usr/local/lib/prestium/i2pd-port-get`;
			@if @ne($i2pd_port, none) {
				proto tcp dport $i2pd_port mod state state NEW ACCEPT;
				proto udp dport $i2pd_port mod state state NEW ACCEPT;
			}
		}

		chain OUTPUT {
			policy DROP;

			# Prestium (Tails): never let conntrack-INVALID packets out
			mod state state INVALID DROP;
			mod state state (ESTABLISHED) ACCEPT;

			# Prestium 1.8: the local-only Firefox (prestium-localfox runs it with primary
			# group prestium-localweb) may open TCP connections only to Prestium's own
			# web pages on 127.0.0.1: i2pd console 7070, I2P Torrents 7685, The Lounge 9000 (I2P)
			# and 9010 (Tor). Everything else (Internet, Tor/I2P proxies, other local ports) is refused.
			mod owner gid-owner $localweb_gid {
				outerface lo daddr 127.0.0.1 proto tcp syn dport (7070 7685 9000 9010) ACCEPT;
				outerface lo mod state state (RELATED) proto icmp ACCEPT;
				LOG log-prefix "Dropped localweb packet: " log-level debug log-uid;
				REJECT reject-with icmp-port-unreachable;
			}

			# Prestium 1.8: The Lounge may reach only the i2pd IRC client tunnels.
			mod owner uid-owner $lounge_uid {
				outerface lo daddr 127.0.0.1 proto tcp syn dport 6665:6672 ACCEPT;
				outerface lo mod state state (RELATED) proto icmp ACCEPT;
				LOG log-prefix "Dropped thelounge packet: " log-level debug log-uid;
				REJECT reject-with icmp-port-unreachable;
			}

			# 2.1: The Lounge's Tor instance may reach only Tor's SOCKS port: no clearnet, no DNS,
			# no other local service. Every IRC network it has goes through the proxy (hook 0200), and
			# a network a user adds or edits without it is refused here.
			mod owner uid-owner $lounge_tor_uid {
				outerface lo daddr 127.0.0.1 proto tcp syn dport 9050 ACCEPT;
				outerface lo mod state state (RELATED) proto icmp ACCEPT;
				LOG log-prefix "Dropped thelounge-tor packet: " log-level debug log-uid;
				REJECT reject-with icmp-port-unreachable;
			}

			# Prestium: i2pd SOCKS outproxy: i2pd may reach its own client tunnel 127.0.0.1:4500
			mod owner uid-owner $i2pd_uid outerface lo daddr 127.0.0.1 proto (tcp udp) dport 4500 ACCEPT;
			outerface lo {
				mod state state (RELATED) proto icmp ACCEPT;

				# Prestium: user apps may only reach the listed local proxies/tunnels
				daddr 127.0.0.1 proto tcp syn dport $user_ports {
					mod owner uid-owner $user_uid ACCEPT;
				}

				# Prestium 2.0: the Tor Connection Assistant's DoH resolver (uid prestium-ptdns) may
				# only reach i2pd's HTTP proxy, i.e. the I2P outproxy; nothing else
				daddr 127.0.0.1 proto tcp syn dport 4444 {
					mod owner uid-owner $ptdns_uid ACCEPT;
				}

				# Prestium 1.8: clock sync (prestium-timesync) may only reach Tor's SOCKS port
				daddr 127.0.0.1 proto tcp syn dport 9050 {
					mod owner uid-owner prestium-htp ACCEPT;
				}
			}

			# Prestium 2.0: per-mode rules from the Tor Connection Assistant (UDP for Snowflake only)
			@include '/etc/ferm/prestium-tor-pt.conf';

			# i2pd needs TCP (NTCP2) and UDP (SSU2)
			# 2.1 (security audit): to the network only. i2pd and Tor parse remote input; on
			# loopback i2pd may reach only its SOCKS outproxy tunnel 4500 (rule above), not The
			# Lounge, the i2pd console or the torrent RPC.
			outerface ! lo mod owner uid-owner $i2pd_uid ACCEPT;
			# Prestium: Tor needs TCP only (obfs4/lyrebird/WebTunnel too). Snowflake's UDP
			# (WebRTC) is allowed by the include above, only while the assistant's Snowflake mode is on.
			outerface ! lo mod owner uid-owner $tor_uid proto tcp ACCEPT;
			# 2.1: on loopback Tor may reach only its pluggable transports, which listen on
			# 127.0.0.1:0, i.e. a port from the kernel's ephemeral range (net.ipv4.ip_local_port_range,
			# 32768-60999 by default; Prestium does not change it). Every fixed local service is below it.
			outerface lo daddr 127.0.0.1 proto tcp syn dport 32768:60999 mod owner uid-owner $tor_uid ACCEPT;
			# 2.1 (fix of A5): and OnionShare's own web server. Its onion service is Tor forwarding port 80
			# to 127.0.0.1:17600-17650 (onion-grater allows no other target); without this the service
			# published but every visit (share, receive, website, chat) was refused at Tor's connect.
			outerface lo daddr 127.0.0.1 proto tcp syn dport 17600:17650 mod owner uid-owner $tor_uid ACCEPT;
			# Prestium 2.0 r18: DHCP lease renewal. NetworkManager's DHCP client (root) gets its first
			# lease over a packet socket, which this table never sees, but renews it with ordinary
			# unicast UDP from port 68 to the server's port 67; without this the renewal is refused
			# and the lease lapses back to a full re-discovery. Root, UDP 68 -> 67, nothing else.
			outerface ! lo mod owner uid-owner 0 proto udp sport 68 dport 67 ACCEPT;

			LOG log-prefix "Dropped outbound packet: " log-level debug log-uid;
			REJECT reject-with icmp-port-unreachable;
		}

		chain FORWARD {
			policy DROP;
		}
	}

	table nat {
		chain PREROUTING {
			policy ACCEPT;
		}

		chain POSTROUTING {
			policy ACCEPT;
		}

		chain OUTPUT {
			policy ACCEPT;
		}
	}
}

# Prestium: IPv6 is disabled (sysctl, NetworkManager, i2pd). These rules
# are the second layer: nothing may send IPv6 at all, not even to ::1.
domain ip6 {
	table filter {
		chain INPUT {
			policy DROP;
			mod state state INVALID DROP;
			mod state state (ESTABLISHED) ACCEPT;
		}

		chain FORWARD {
			policy DROP;
		}

		chain OUTPUT {
			policy DROP;
			mod state state INVALID DROP;
			mod state state (ESTABLISHED) ACCEPT;

			LOG log-prefix "Dropped outbound packet: " log-level debug log-uid;
			REJECT reject-with icmp6-port-unreachable;
		}
	}
}
