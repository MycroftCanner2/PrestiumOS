# Fallback only: dconf (etc/dconf/db/local.d/10-prestium-desktop, compiled by hook
# 0400) is the single authority for these values. GTK reads this file when no
# settings backend answers (no D-Bus session); it must mirror dconf.
[Settings]
gtk-theme-name=Adwaita
gtk-icon-theme-name=Adwaita
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
gtk-font-name=Cantarell 11
gtk-application-prefer-dark-theme=0
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
