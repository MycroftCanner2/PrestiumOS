# Prestium 2.1 (audit of a5fd1fb, L-7; review N-1): PCManFM runs unconfined, so it doesn't decode downloaded
# files for thumbnails. Pictures open in Loupe, which is confined. libfm reads show_thumbnail from [ui]
# only; the [config] lines are Debian's libfm-data defaults (this file replaces that conffile).
[config]
single_click=0
use_trash=1
confirm_del=1
terminal=x-terminal-emulator %s
thumbnail_local=1
thumbnail_max=2048

[ui]
big_icon_size=48
small_icon_size=16
pane_icon_size=16
thumbnail_size=128
show_thumbnail=0
