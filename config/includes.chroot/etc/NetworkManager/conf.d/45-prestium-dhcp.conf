# Prestium (security review F-03): DHCP tells the network nothing about this computer.
# NetworkManager sends the system hostname ("prestium") in DHCPv4 option 12 / FQDN and in DHCPv6 by
# default, which names Prestium to every DHCP server and anyone watching the local network. These
# are the global defaults for every connection, including ones the user adds later (a profile that
# sets the property itself still wins, so none is shipped).
[main]
# NetworkManager's own DHCP client (isc-dhcp-client is installed but must never be used: its
# dhclient.conf sends the hostname; hook 0400 also removes that line)
dhcp=internal

[connection]
ipv4.dhcp-send-hostname=false
ipv6.dhcp-send-hostname=false
# the client identifiers come from the (random, per-boot) MAC address only, never from the machine
# id, the interface name or a stored DUID
ipv4.dhcp-client-id=mac
ipv4.dhcp-iaid=mac
ipv6.dhcp-duid=ll
ipv6.dhcp-iaid=mac
