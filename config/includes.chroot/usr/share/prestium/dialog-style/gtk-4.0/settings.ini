# Prestium 2.1 (dialog look): zenity's GTK settings, the same as /etc/gtk-4.0/settings.ini (the
# session's); libadwaita follows the session color scheme through the settings portal or dconf.
[Settings]
gtk-theme-name=Adwaita
gtk-icon-theme-name=Adwaita
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
gtk-font-name=Cantarell 11
gtk-application-prefer-dark-theme=0
gtk-xft-antialias=1
gtk-xft-hinting=1
gtk-xft-hintstyle=hintslight
gtk-xft-rgba=rgb
