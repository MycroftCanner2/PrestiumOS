# Prestium (security review F-01): the desktop portal's back ends. xdg-desktop-portal reads only this
# directory (XDG_DESKTOP_PORTAL_DIR, set by its systemd drop-in), so nothing in the user's home can add
# or change a back end. Only three interfaces have one: the file chooser, the application chooser
# (OpenURI needs it to exist; for the links Prestium handles it never opens, see portal-open) and the
# settings (colour scheme, fonts). Everything else (Inhibit, Print, Email, Access, Account,
# DynamicLauncher, Lockdown, Notification, Screenshot, ScreenCast, RemoteDesktop, Background, Secret,
# Wallpaper, ...) has none, so the portal does not offer it. The confined applications' D-Bus filter
# (app-confine) allows even fewer calls.
[preferred]
default=none
org.freedesktop.impl.portal.FileChooser=gtk
org.freedesktop.impl.portal.AppChooser=gtk
org.freedesktop.impl.portal.Settings=gtk
