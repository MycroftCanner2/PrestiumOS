  <defs>
    <linearGradient id="p" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#0066ff"/>
      <stop offset="1" stop-color="#00ffff"/>
    </linearGradient>
  </defs>
  <rect x="4.75" y="4.75" width="118.5" height="118.5" rx="27.25" fill="#1e1e1e" stroke="#333333" stroke-width="1.5"/>
  <path d="M42 100 V30 H70 A20 20 0 0 1 70 70 H54" fill="none" stroke="url(#p)" stroke-width="13"
