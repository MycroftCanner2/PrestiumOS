# Prestium 2.0 r11: fixed swaylock settings (the broker starts swaylock with this file, never ~/.config)
# 2.1 (design batch): Tech Innovation colours (dark grey, Electric Blue ring, Neon Cyan typing and verify)
# 2.1 (contrast review): the password prompt redesigned for contrast. It is always shown (also before the
# first key), a raised grey disc with a blue ring on the dark screen. Each state has its own ring and a
# tinted disc, and the text in the disc is white or, for Caps Lock, amber (every text pair 10:1 or more):
#   typing      blue ring #3d8bff (5.5:1 on the screen), white tick per key, dark gap per backspace
#   Verifying   cyan ring, blue-green disc       Wrong   red ring, red-brown disc
#   Caps Lock   amber ring, amber text, brown disc (dark ticks on the amber ring)
#   Cleared     grey ring
# Every ring and tick is 3:1 or more against what is next to it (tests/test_contrast.py checks them all).
color=161616
show-failed-attempts
ignore-empty-password
indicator-idle-visible
indicator-caps-lock
font=Cantarell
font-size=22
indicator-radius=100
indicator-thickness=10
text-color=ffffffff
inside-color=262626ff
ring-color=3d8bffff
key-hl-color=ffffffff
bs-hl-color=161616ff
inside-clear-color=262626ff
ring-clear-color=a8a8a8ff
text-clear-color=ffffffff
inside-ver-color=10262bff
ring-ver-color=33d6ffff
text-ver-color=ffffffff
inside-wrong-color=2b1616ff
ring-wrong-color=ff6b6bff
text-wrong-color=ffffffff
inside-caps-lock-color=2a2416ff
ring-caps-lock-color=ffd166ff
text-caps-lock-color=ffd166ff
caps-lock-key-hl-color=161616ff
caps-lock-bs-hl-color=6b1414ff
layout-bg-color=262626ff
layout-border-color=3d8bffff
layout-text-color=ffffffff
line-color=00000000
line-clear-color=00000000
line-ver-color=00000000
line-wrong-color=00000000
line-caps-lock-color=00000000
separator-color=00000000
