# Prestium 2.1 (confirm-dialog contrast): the broker points XDG_CONFIG_HOME here, so these dialogs
# never read the user's ~/.config or session dconf. prefer-dark must be set in this file (GTK 3)
# or zenity would follow the light Adwaita palette except for the dark surfaces in gtk.css.
[Settings]
gtk-theme-name=Adwaita
gtk-application-prefer-dark-theme=1
gtk-icon-theme-name=Prestium
gtk-font-name=Cantarell 10
gtk-xft-antialias=1
gtk-xft-hintstyle=hintslight
gtk-cursor-theme-name=Adwaita
gtk-cursor-theme-size=24
gtk-decoration-layout=:
