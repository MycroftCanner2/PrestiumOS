# Prestium 2.1 (review of 6bf1234): the I2P lock files, root-only regular files made at boot, before
# i2pd or the I2P Connection Assistant can run. flock(2) works on any open file, so a lock file another
# user could open would let that user hold Apply or i2pd's start up.
#   /run/prestium-hops.lock       i2pd's config lock (prestium-i2pd-port, prestium-i2p-mode apply)
#   /run/prestium-i2p-apply.lock  one Apply at a time (prestium-i2p-mode apply)
f /run/prestium-hops.lock 0600 root root -
f /run/prestium-i2p-apply.lock 0600 root root -
