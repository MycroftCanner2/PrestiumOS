# Prestium 2.0 r10: safety flags (prestium-safety-notify); created at boot so sandboxed services
# (ProtectSystem=strict) can write them
d /run/prestium 0755 root root -
d /run/prestium/safety 0755 root root -
# 2.1: mount point of the Browser Updater's tmpfs (prestium-browser-install mounts it on first use)
d /run/prestium/browsers 0755 root root -
# 2.1: virtual machine detection and network diagnosis (prestium-vm-netcheck writes, prestium-vm-notify reads)
d /run/prestium/vm 0755 prestium-vmcheck prestium-vmcheck -
# 2.1 (design batch): Tor and I2P state for the panel (prestium-netstatus writes, waybar reads)
d /run/prestium/netstatus 0755 prestium-netstatus prestium-netstatus -
# 2.1: the Tor, I2P and onion-grater logs for the desktop user (prestium-logs writes, prestium-logs-view reads).
# setgid group user: the files get group user, so only the desktop user (and prestium-logs) can read them
d /run/prestium/logs 2750 prestium-logs user -
