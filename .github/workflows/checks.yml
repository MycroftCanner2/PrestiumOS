# Prestium 2.1 (security audit): run tests/ci.sh on every push and pull request, on Debian 13.
name: checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    container: debian:trixie
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install tools (Debian 13)
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            git ca-certificates shellcheck apparmor systemd gnupg gpgv dpkg-dev apt \
            python3 python3-gi gir1.2-glib-2.0 python3-dbus dbus socat xz-utils curl \
            util-linux iproute2 procps nodejs
      - name: Checks
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          tests/ci.sh
